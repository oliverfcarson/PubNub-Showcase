<html>

<HEAD>
    <TITLE>PubNub Showcase Demo</TITLE>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#161C2D">
    <meta name="apple-mobile-web-app-status-bar-style" content="#161C2D">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <!--  Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">

    <link rel="icon" href="./web/favicon.ico" />
    <link rel="stylesheet" href="./web/iot/iot.css">
    <link rel="stylesheet" href="./web/shared/style.css" />
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
    <script src="./web/shared/shared.js"></script>
    <script src="./web/shared/keys.js"></script>
    <script src="./web/iot/iot.js"></script>
    <script src="./web/iot/simulation.js"></script>
    <script src="./web/iot/simulator_types.js"></script>
    <script src="./web/iot/device.js"></script>
    <script src="./web//iot/worker_device_sim.js"></script>
    <script src="./web/iot/loading-card.js"></script>
    <script src="./web/iot/slider.js"></script>
    <script src="https://www.pubnub.com/scripts/amplitude.js" defer></script>
</HEAD>

<body onload="initialize()" id="body">
    <div id="header" class="">
        <div class="blue-ellipse-bkd"></div>
        <H2 id='heading' class="demo-header heading-2">IoT Home</H2>
        <div class="red-ellipse-bkd"></div>
    </div>
    <div class="iot-container">
        <div class="quick_activity_wrap top_grid_layout" id="registeredDevicesList">
            <section id="tempdevice1"><loading-card-large/></section>
            <section id="tempdevice2"><loading-card-large/></section>
            <section id="tempdevice3"><loading-card-large/></section>
            <section id="tempdevice4"><loading-card-large/></section>
            <section id="tempdevice5"><loading-card-large/></section>
        </div>
        <div class="quick_activity_wrap quick_activity-wrap-top-border" id="registedDeviceListDiscrete">
            <section id="alarmdevice1"><loading-card-small/></section>
            <section id="alarmdevice2"><loading-card-small/></section>
        </div>
    </div>
    <div style="position: relative;">
        <div id="status-message-section" class="col status-message-wrapper">
        </div>
</body>

</html>
