<HTML>

<HEAD>
    <TITLE>PubNub Showcase | Real-Time Data Streaming Demo</TITLE>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#161C2D">
    <meta name="apple-mobile-web-app-status-bar-style" content="#161C2D">

    <!--  Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800" rel="stylesheet">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">

    <link rel="icon" href="web/favicon.ico" />
    <link rel="stylesheet" href="web/data-streaming/data-streaming.css" />
    <link rel="stylesheet" href="web/shared/style.css" />
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.8.2.10.min.js"></script>
    <script src="web/shared/shared.js"></script>
    <script src="web/shared/keys.js"></script>
    <script src="web/data-streaming/data-streaming.js"></script>
    <script src="web/data-streaming/streams.js"></script>

    <script src="https://www.pubnub.com/scripts/amplitude.js" defer></script>
</HEAD>

<BODY onload="loadRealTime()">

    <div id="header" class="">
        <div class="blue-ellipse-bkd"></div>
        <H2 id='heading' class="demo-header heading-2">Data Streaming</H2>
        <div class="red-ellipse-bkd"></div>
    </div>

    <div class="main-container">
        <div id='messageList' class="message-list">

            <div id='messageListContents' class="message-list-contents text-label">

            </div>
        </div>

        <div class="rhs text-body-2">

            <div id="pick-stream" class="stream-selection">

                <div class="row">
                    <div class="">Choose Stream: </div>
                </div>
                <div class="row">
                    <div class="stream-option">
                        <nobr>
                            <input class="pn-check form-check-input" type="checkbox" id="twitter"
                                onchange="streamSelected(this);">
                            <label class="form-check-label" for="twitter">
                                <i class="bi bi-twitter"></i> Twitter Posts
                            </label>
                        </nobr>
                    </div>
                </div>
                <div class="row">

                    <div class="stream-option">
                        <nobr>
                            <input class="pn-check form-check-input" type="checkbox" id="wikipedia"
                                onchange="streamSelected(this);">
                            <label class="form-check-label" for="wikipedia">
                                <i class="bi bi-wikipedia"></i> Wikipedia Updates (Live)
                            </label>
                        </nobr>
                    </div>
                </div>
                <div class="row">

                    <div class="stream-option">
                        <nobr>
                            <input class="pn-check form-check-input" type="checkbox" id="sensors"
                                onchange="streamSelected(this);" checked>
                            <label class="form-check-label" for="sensors">
                                <i class="bi bi-thermometer-half"></i> Simulated Streams
                            </label>
                        </nobr>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
</BODY>

</HTML>
